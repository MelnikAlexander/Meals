<ion-header>
  <ion-toolbar>
    <ion-title>Select Meal</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item
      button
      *ngFor="let meal of meals$ | async"
      (click)="selectMeal(meal)">
      <ion-label>{{ meal }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
